<div class="dashboard">
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
          <path d="M8 16L13 21L24 10" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-name">ExamGest MG</span>
    </div>
    <div class="topbar-right">
      <div class="user-badge">
        <span class="user-initials">{{ user?.nom?.[0] }}{{ user?.prenom?.[0] }}</span>
        <span class="user-name">{{ user?.prenom }} {{ user?.nom }}</span>
        <span class="role-tag">{{ user?.role }}</span>
      </div>
      <button class="btn-logout" (click)="logout()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Déconnexion
      </button>
    </div>
  </header>

  <main class="content">
    <div class="welcome-card">
      <div class="welcome-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div>
        <h1>Bienvenue, {{ user?.prenom }} !</h1>
        <p>Vous êtes connecté en tant que <strong>{{ user?.role }}</strong>. Votre espace sera bientôt disponible.</p>
      </div>
    </div>
  </main>
</div>
